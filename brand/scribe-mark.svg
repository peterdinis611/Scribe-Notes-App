<?xml version="1.0" encoding="UTF-8"?>
<!--
  Scribe official mark  interlocking dual arcs (cyan + amber).
  Source of truth for app icon, favicon, and in-app brand.
  Colors: amber #FFC131 · cyan #24C8DB · ink #0E1210
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Scribe">
  <defs>
    <style>
      .ink { fill: #0E1210; }
      .amber { fill: #FFC131; stroke: #FFC131; }
      .cyan { fill: #24C8DB; stroke: #24C8DB; }
    </style>
  </defs>

  <!-- Transparent mark only  no background -->
  <g fill="none" stroke-width="56" stroke-linecap="butt" stroke-linejoin="round">
    <!-- Amber arc (top-right), gap toward center -->
    <path
      class="amber"
      d="M 348 118
         A 118 118 0 1 1 268 346"
    />
    <circle class="amber" cx="348" cy="190" r="28" stroke="none" />

    <!-- Cyan arc (bottom-left), gap toward center -->
    <path
      class="cyan"
      d="M 164 394
         A 118 118 0 1 1 244 166"
    />
    <circle class="cyan" cx="164" cy="322" r="28" stroke="none" />
  </g>
</svg>
