<!doctype html>
<html lang="sk" data-ui-skin="classic">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Scribe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      ;(function () {
        var classic = {
          light: {
            background: '#ffffff',
            foreground: '#1d1d1f',
            mutedForeground: '#86868b',
            border: 'rgba(0, 0, 0, 0.08)',
            sidebar: 'rgba(246, 246, 246, 0.72)',
            sidebarSolid: '#f5f5f7',
            toolbar: 'rgba(251, 251, 253, 0.82)',
            selection: 'rgba(0, 122, 255, 0.14)',
            selectionStrong: '#007aff',
            hover: 'rgba(0, 0, 0, 0.04)',
            separator: 'rgba(0, 0, 0, 0.06)',
            formatBar: 'rgba(255, 255, 255, 0.92)',
            destructive: '#ff3b30',
            colorScheme: 'light',
          },
          dark: {
            background: '#1e1e1e',
            foreground: '#f5f5f7',
            mutedForeground: '#98989d',
            border: 'rgba(255, 255, 255, 0.08)',
            sidebar: 'rgba(40, 40, 40, 0.72)',
            sidebarSolid: '#2c2c2e',
            toolbar: 'rgba(30, 30, 30, 0.82)',
            selection: 'rgba(10, 132, 255, 0.22)',
            selectionStrong: '#0a84ff',
            hover: 'rgba(255, 255, 255, 0.06)',
            separator: 'rgba(255, 255, 255, 0.06)',
            formatBar: 'rgba(44, 44, 46, 0.92)',
            destructive: '#ff453a',
            colorScheme: 'dark',
          },
        }
        var press = {
          light: {
            background: '#eaeef2',
            foreground: '#15202b',
            mutedForeground: '#667484',
            border: 'rgba(21, 32, 43, 0.12)',
            sidebar: 'rgba(223, 229, 235, 0.92)',
            sidebarSolid: '#dfe5eb',
            toolbar: 'rgba(234, 238, 242, 0.94)',
            selection: 'rgba(196, 92, 38, 0.16)',
            selectionStrong: '#c45c26',
            hover: 'rgba(21, 32, 43, 0.05)',
            separator: 'rgba(21, 32, 43, 0.08)',
            formatBar: 'rgba(248, 250, 252, 0.96)',
            destructive: '#b42318',
            colorScheme: 'light',
          },
          dark: {
            background: '#14181e',
            foreground: '#e8e4dc',
            mutedForeground: '#8b939e',
            border: 'rgba(232, 228, 220, 0.1)',
            sidebar: 'rgba(26, 32, 40, 0.94)',
            sidebarSolid: '#1a2028',
            toolbar: 'rgba(20, 24, 30, 0.94)',
            selection: 'rgba(212, 120, 74, 0.22)',
            selectionStrong: '#d4784a',
            hover: 'rgba(232, 228, 220, 0.06)',
            separator: 'rgba(232, 228, 220, 0.08)',
            formatBar: 'rgba(30, 36, 44, 0.96)',
            destructive: '#f97066',
            colorScheme: 'dark',
          },
        }

        var root = document.documentElement
        var themeId = 'system'
        var customTheme = null
        var uiSkin = 'classic'

        var resolved = themeId
        if (themeId === 'system') {
          resolved = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }

        var presets = uiSkin === 'press' ? press : classic
        var colors = customTheme
        if (!colors && (resolved === 'light' || resolved === 'dark') && presets[resolved]) {
          colors = presets[resolved]
        }
        if (!colors) colors = classic.light

        var map = {
          background: '--color-background',
          foreground: '--color-foreground',
          mutedForeground: '--color-muted-foreground',
          border: '--color-border',
          sidebar: '--color-sidebar',
          sidebarSolid: '--color-sidebar-solid',
          toolbar: '--color-toolbar',
          selection: '--color-selection',
          selectionStrong: '--color-selection-strong',
          hover: '--color-hover',
          separator: '--color-separator',
          formatBar: '--color-format-bar',
          destructive: '--color-destructive',
        }

        for (var key in map) {
          if (colors[key]) root.style.setProperty(map[key], colors[key])
        }

        root.style.setProperty('--color-accent', colors.selectionStrong)
        root.style.setProperty('--color-surface', colors.sidebarSolid)
        root.style.setProperty('--color-surface-elevated', colors.background)
        root.style.setProperty('--color-canvas', colors.sidebarSolid)

        var scheme = colors.colorScheme || (resolved === 'dark' ? 'dark' : 'light')
        root.dataset.theme = themeId === 'system' ? 'system' : resolved
        root.dataset.uiSkin = uiSkin
        if (scheme === 'dark') root.classList.add('dark')
        root.style.colorScheme = scheme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
