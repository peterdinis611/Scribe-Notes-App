<!doctype html>
<html lang="sk" data-ui-skin="grove">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Scribe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      ;(function () {
        var grove = {
          light: {
            background: '#e7efe4',
            foreground: '#1c2b22',
            mutedForeground: '#5c7264',
            border: 'rgba(28, 43, 34, 0.12)',
            sidebar: 'rgba(214, 228, 210, 0.88)',
            sidebarSolid: '#d6e4d2',
            toolbar: 'rgba(231, 239, 228, 0.94)',
            selection: 'rgba(63, 122, 90, 0.18)',
            selectionStrong: '#3f7a5a',
            hover: 'rgba(28, 43, 34, 0.05)',
            separator: 'rgba(28, 43, 34, 0.08)',
            formatBar: 'rgba(244, 248, 242, 0.96)',
            destructive: '#b42318',
            colorScheme: 'light',
          },
          dark: {
            background: '#121a16',
            foreground: '#e4efe6',
            mutedForeground: '#8fa898',
            border: 'rgba(228, 239, 230, 0.1)',
            sidebar: 'rgba(22, 32, 26, 0.94)',
            sidebarSolid: '#16201a',
            toolbar: 'rgba(18, 26, 22, 0.94)',
            selection: 'rgba(124, 184, 146, 0.22)',
            selectionStrong: '#7cb892',
            hover: 'rgba(228, 239, 230, 0.06)',
            separator: 'rgba(228, 239, 230, 0.08)',
            formatBar: 'rgba(28, 40, 33, 0.96)',
            destructive: '#f97066',
            colorScheme: 'dark',
          },
        }

        var root = document.documentElement
        var themeId = 'system'
        var customTheme = null
        var uiSkin = 'grove'
        try {
          var storedSkin = localStorage.getItem('scribe-ui-skin')
          if (storedSkin === 'classic') uiSkin = 'classic'
          else uiSkin = 'grove'
        } catch (e) {}

        var resolved = themeId
        if (themeId === 'system') {
          resolved = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }

        var colors = customTheme
        if (!colors && (resolved === 'light' || resolved === 'dark') && grove[resolved]) {
          colors = grove[resolved]
        }
        if (!colors) colors = grove.light

        var map = {
          background: '--color-background',
          foreground: '--color-foreground',
          mutedForeground: '--color-muted-foreground',
          border: '--color-border',
          sidebar: '--color-sidebar',
          sidebarSolid: '--color-sidebar-solid',
          toolbar: '--color-toolbar',
          selection: '--color-selection',
          selectionStrong: '--color-selection-strong',
          hover: '--color-hover',
          separator: '--color-separator',
          formatBar: '--color-format-bar',
          destructive: '--color-destructive',
        }

        for (var key in map) {
          if (colors[key]) root.style.setProperty(map[key], colors[key])
        }

        root.style.setProperty('--color-accent', colors.selectionStrong)
        root.style.setProperty('--color-surface', colors.sidebarSolid)
        root.style.setProperty('--color-surface-elevated', colors.background)
        root.style.setProperty('--color-canvas', colors.sidebarSolid)

        var scheme = colors.colorScheme || (resolved === 'dark' ? 'dark' : 'light')
        root.dataset.theme = themeId === 'system' ? 'system' : resolved
        root.dataset.uiSkin = uiSkin
        if (scheme === 'dark') root.classList.add('dark')
        root.style.colorScheme = scheme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
