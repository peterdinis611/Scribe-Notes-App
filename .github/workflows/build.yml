# Native Tauri builds — version tags or manual dispatch.
# On tags: creates/updates a draft GitHub Release and uploads macOS artifacts.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  tauri:
    name: Tauri (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: ''
            release: true
          - name: Linux
            os: ubuntu-24.04
            args: --no-bundle
            release: false
          - name: Windows
            os: windows-latest
            args: --no-bundle
            release: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux WebKit / GTK deps
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -y
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            build-essential \
            pkg-config

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Version sync
        run: bun run version:check
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Build Tauri app (release draft on tag / macOS)
        if: matrix.release && startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: v__VERSION__
          releaseName: 'Scribe v__VERSION__'
          releaseBody: |
            Draft release for Scribe __VERSION__.

            - macOS: `.dmg` / `.app` attached when the Build workflow finishes
            - Linux / Windows: compile-checked in CI (`--no-bundle`); ship packages from a signed runner when ready
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      - name: Build Tauri app (no release upload)
        if: ${{ !(matrix.release && startsWith(github.ref, 'refs/tags/v')) }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: ${{ matrix.release }}
