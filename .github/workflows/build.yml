# Native Tauri builds — only on version tags (v*) or manual dispatch.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tauri:
    name: Tauri (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: ''
            artifacts: true
          - name: Linux
            os: ubuntu-22.04
            args: --no-bundle
            artifacts: false
          - name: Windows
            os: windows-latest
            args: --no-bundle
            artifacts: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux WebKit / GTK deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            build-essential

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Version sync
        run: bun run version:check
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: ${{ matrix.artifacts }}
