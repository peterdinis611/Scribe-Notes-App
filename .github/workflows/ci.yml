name: CI

on:
  push:
    branches: [main, 'version-*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (lint · test · build)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Version sync
        run: bun run version:check
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Typecheck + Vite build
        run: bun run build

  nlp:
    name: NLP (Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Unit tests
        run: PYTHONPATH=nlp python3 -m unittest discover -s nlp/tests -p 'test_*.py'

  python-ui:
    name: Python UI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Unit tests
        run: PYTHONPATH=python-ui python3 -m unittest discover -s python-ui/tests -p 'test_*.py'

  path-commands:
    name: Tauri path command inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check path-bearing commands
        run: python3 scripts/check_tauri_path_commands.py

  # Pure workspace crates (no Tauri / WebKit). Fast feedback for scribe-audit et al.
  rust-libs:
    name: Rust libs (exclude app)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          prefix-key: rust-libs

      - name: Clippy scribe-audit
        run: cargo clippy -p scribe-audit --locked --all-targets -- -D warnings

      - name: Test workspace crates (exclude app)
        run: cargo test --workspace --exclude app --locked

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux WebKit / GTK deps
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -y
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            build-essential \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> target

      - name: Cargo test (workspace + app)
        run: cargo test --workspace --locked
