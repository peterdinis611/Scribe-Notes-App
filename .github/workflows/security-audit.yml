name: Security audit

on:
  push:
    branches: [main, 'version-*']
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: bun install --frozen-lockfile
      # Repo uses bun.lock (no package-lock.json); npm audit cannot run.
      # Ignore SheetJS community CVEs — no fixed 0.18.x release on the OSS line.
      - name: Audit dependencies
        run: >
          bun audit --audit-level=high
          --ignore GHSA-4r6h-8v6p-xvw6
          --ignore GHSA-5pgg-2g8v-p4x9


  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit workspace
        run: cargo audit

  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features
          command: check

  tauri-path-commands:
    name: Tauri path command inventory
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check path-bearing commands
        run: python3 scripts/check_tauri_path_commands.py

  tauri-command-permissions:
    name: Tauri command permission inventory
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check command groups match generate_handler
        run: python3 scripts/check_tauri_command_permissions.py

  pip-audit-nlp:
    name: pip-audit (nlp)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: nlp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pip-audit + hashed lockfile
        run: |
          set -euo pipefail
          python -m pip install --upgrade 'pip>=26.2' pip-audit
          if [ -f requirements.lock ]; then
            python -m pip install --require-hashes -r requirements.lock
          else
            echo "requirements.lock missing — install floors from requirements.in"
            python -m pip install -r requirements.in
          fi
      - name: Audit installed packages
        run: python -m pip_audit --progress-spinner off --strict
