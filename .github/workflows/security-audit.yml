name: Security audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: bun install --frozen-lockfile
      # Repo uses bun.lock (no package-lock.json); npm audit cannot run.
      # Ignore SheetJS community CVEs — no fixed 0.18.x release on the OSS line.
      - name: Audit dependencies
        run: >
          bun audit --audit-level=high
          --ignore GHSA-4r6h-8v6p-xvw6
          --ignore GHSA-5pgg-2g8v-p4x9


  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit workspace
        run: cargo audit

  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features
          command: check

  tauri-path-commands:
    name: Tauri path command inventory
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check path-bearing commands
        run: python3 scripts/check_tauri_path_commands.py
