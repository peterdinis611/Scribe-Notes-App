[project]
name = "scribe-nlp"
version = "0.8.0"
description = "Optional local NLP sidecar for Scribe"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Peter Dinis" }]
dependencies = []

[project.optional-dependencies]
quality = ["sentence-transformers>=3.0.0"]

[project.scripts]
scribe-nlp = "scribe_nlp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["scribe_nlp*"]

[tool.setuptools.package-data]
scribe_nlp = ["data/*.txt"]
