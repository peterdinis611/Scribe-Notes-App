[project]
name = "scribe-nlp"
version = "1.8.0"
description = "Optional local NLP sidecar for Scribe"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Peter Dinis" }]
dependencies = []

[project.optional-dependencies]
quality = ["sentence-transformers>=3.0.0"]
enhance = [
  "rapidfuzz>=3.6.0",
  "lingua-language-detector>=2.0.2",
  "ftfy>=6.2.0",
  "dateparser>=1.2.0",
]
translate = ["argostranslate>=1.9.6"]
ner = ["spacy>=3.7.0"]
onnx = [
  "onnxruntime>=1.17.0",
  "numpy>=1.24.0",
  "tokenizers>=0.15.0",
  "huggingface_hub>=0.20.0",
]
faiss = ["faiss-cpu>=1.7.4", "numpy>=1.24.0"]
fast-embed = ["model2vec>=0.4.0", "numpy>=1.24.0"]
lexical = ["bm25s>=0.2.0", "numpy>=1.24.0"]
hnsw = ["pynear>=2.0.0", "numpy>=1.24.0"]
# Pillow 13.0.0+ required (CVE fixes vs <=12.3.0). Needs Python 3.11+.
image = ["pillow>=13.0.0; python_version >= '3.11'"]
# MoviePy 2.2.1 still declares pillow<12 (CVE conflict). Install moviepy without
# resolving that pin, then force Pillow >=13 (see nlp/README.md).
video = [
  "imageio>=2.5,<3.0",
  "imageio-ffmpeg>=0.2.0",
  "numpy>=1.25.0",
  "decorator>=4.0.2,<6.0",
  "proglog<=1.0.0",
  "python-dotenv>=0.10",
]
full = [
  "scribe-nlp[quality,enhance,translate,ner,onnx,faiss,fast-embed,lexical,hnsw,image,video]",
]

[project.scripts]
scribe-nlp = "scribe_nlp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["scribe_nlp*"]

[tool.setuptools.package-data]
scribe_nlp = ["data/*.txt"]
