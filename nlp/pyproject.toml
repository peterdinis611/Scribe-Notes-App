[project]
name = "scribe-nlp"
version = "0.1.0"
description = "Optional local NLP sidecar for Scribe"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
scribe-nlp = "scribe_nlp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["scribe_nlp*"]
