commands.allow = ["logging_write"]

[[permission]]
identifier = "allow-logging-ping"
description = "Allow logging_ping"
commands.allow = ["logging_ping"]

[[permission]]
identifier = "allow-logging-recent"
description = "Allow logging_recent"
commands.allow = ["logging_recent"]

[[permission]]
identifier = "allow-logging-clear"
