identifier = "group-logging"
description = "Command group: logging"
permissions = [
  "allow-logging-status",
  "allow-logging-settings",
  "allow-normalize-logging-settings",
  "allow-logging-settings-from-json",
  "allow-logging-write",
  "allow-logging-ping",
  "allow-logging-recent",
  "allow-logging-clear",
  "allow-logging-stats",
  "allow-logging-set-level",
  "allow-logging-scopes",
