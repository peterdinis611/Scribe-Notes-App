commands.allow = ["reveal_in_finder"]

[[set]]
identifier = "group-storage"
description = "Command group: storage"
permissions = [
  "allow-get-storage-disk-usage",
  "allow-get-storage-settings",
  "allow-pick-documents-directory",
  "allow-reveal-documents-directory",
  "allow-reveal-in-finder",
]
