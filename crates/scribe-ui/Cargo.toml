[package]
name = "scribe-ui"
version = "3.5.0"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
authors = ["Peter Dinis"]
description = "UI domain logic and Dioxus chrome surfaces for Scribe"

[features]
default = []
dioxus = ["dep:dioxus", "dep:dioxus-ssr"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = { version = "0.26", features = ["derive"] }
thiserror = "1.0"
chrono = { version = "0.4", features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
fuzzy-matcher = "0.3"
rand = "0.8"
dioxus = { version = "0.6", default-features = false, features = ["html", "macro", "signals", "hooks"], optional = true }
dioxus-ssr = { version = "0.6", optional = true }
