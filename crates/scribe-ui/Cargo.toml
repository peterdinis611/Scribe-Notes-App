[package]
name = "scribe-ui"
version = "3.4.0"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
authors = ["Peter Dinis"]
description = "UI domain logic and helpers for Scribe — version, Whats New, settings nav, theme, ICS, fuzzy"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = { version = "0.26", features = ["derive"] }
thiserror = "1.0"
chrono = { version = "0.4", features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
fuzzy-matcher = "0.3"
rand = "0.8"
