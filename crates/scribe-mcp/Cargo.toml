[package]
name = "scribe-mcp"
version = "5.1.0"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
authors = ["Peter Dinis"]

[[bin]]
name = "scribe-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "json",
  "multipart",
  "query",
  "tokio",
  "tower-log",
] }
base64 = "0.22"
rmcp = { version = "3.2", features = [
  "server",
  "transport-io",
  "transport-streamable-http-server",
  "macros",
] }
schemars = { version = "1.2", features = ["derive"] }
scribe-core = { path = "../scribe-core", features = ["enhance"] }
scribe-agent = { path = "../scribe-agent" }
scribe-audit = { path = "../scribe-audit" }
scribe-ui = { path = "../scribe-ui" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
