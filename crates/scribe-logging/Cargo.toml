[package]
name = "scribe-logging"
version = "5.4.0"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
authors = ["Peter Dinis"]
description = "Terminal / env log level resolution and stdout logging for Scribe"

[features]
default = ["terminal"]
terminal = ["dep:fern", "dep:chrono"]

[dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", optional = true, default-features = false, features = ["clock"] }
fern = { version = "0.7", optional = true, features = ["colored"] }
