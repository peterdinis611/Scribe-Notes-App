[package]
name = "scribe-apis"
version = "5.5.0"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
authors = ["Peter Dinis"]
description = "Opt-in free public API clients for Scribe (geocode, weather, wiki, research, FX, countries)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.12", default-features = true, features = ["json"] }
urlencoding = "2.1"

[dev-dependencies]
serde_json = "1.0"
