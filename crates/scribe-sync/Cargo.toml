[package]
name = "scribe-sync"
version = "5.1.0"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
authors = ["Peter Dinis"]
description = "Disk ↔ SQLite sync for Scribe — .scribe files, persist queue, reconcile"

[dependencies]
dirs = "6"
log = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
