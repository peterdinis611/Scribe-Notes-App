[package]
name = "scribe-audit"
version = "5.4.0"
edition = "2021"
rust-version = "1.89.0"
license = "MIT"
authors = ["Peter Dinis"]
description = "Append-only audit log for the Scribe app and MCP — separate SQLite file"

[dependencies]
rusqlite = { version = "0.42", default-features = false, features = ["bundled", "cache"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
sha2 = "0.10"
hex = "0.4"
