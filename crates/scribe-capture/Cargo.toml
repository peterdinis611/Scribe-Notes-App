[package]
name = "scribe-capture"
version = "5.1.0"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
authors = ["Peter Dinis"]
description = "Local LAN capture HTTP protocol — mobile clip inbox for Scribe"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
