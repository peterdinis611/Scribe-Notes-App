[package]
name = "scribe-core"
version = "1.0.0"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
regex = "1"
dirs = "6"
