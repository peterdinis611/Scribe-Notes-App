[package]
name = "scribe-core"
version = "2.5.0"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
authors = ["Peter Dinis"]

[features]
default = []
# Optional speed/quality extras (mirror Python scribe-nlp[enhance]).
fuzzy = ["dep:rapidfuzz"]
search-fast = ["dep:rayon"]
vectors = ["dep:simsimd"]
unicode = ["dep:encoding_rs", "dep:chardetng"]
enhance = ["fuzzy", "search-fast", "vectors", "unicode"]

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
regex = "1"
dirs = "6"
zip = "2"
quick-xml = "0.42"
rapidfuzz = { version = "0.5", optional = true }
rayon = { version = "1.10", optional = true }
simsimd = { version = "6", optional = true }
encoding_rs = { version = "0.8", optional = true }
chardetng = { version = "1.0", optional = true }
